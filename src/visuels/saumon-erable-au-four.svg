<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Saumon à l'érable au four</title>
  <desc id="d">Illustration à plat : un filet de saumon glacé avec une feuille d'érable, fond sarcelle.</desc>
  <rect width="400" height="300" fill="#3E7C7B" />
  <g fill="none" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vapeur -->
    <path d="M150 110c-8-10-8-18 0-27M178 106c-8-10-8-18 0-27" opacity="0.5" />
    <!-- filet de saumon -->
    <path d="M96 190c20-40 90-56 150-40 18 5 30 14 34 22-4 8-16 17-34 22-60 16-130 0-150-40z" fill="#FBF7F0" />
    <!-- stries du filet -->
    <path d="M140 150c18 26 18 44 0 66M176 146c20 28 20 46 0 74M212 150c18 24 18 42 0 62" stroke="#2B2B2B" opacity="0.25" stroke-width="4" />
    <!-- feuille d'érable -->
    <g transform="translate(300 210)">
      <path d="M0-26l6 12 12-6-6 12 12 2-12 8 6 12-12-6-6 12-6-12-12 6 6-12-12-8 12-2-6-12 12 6z" fill="#FBF7F0" stroke-width="3" />
      <path d="M0 20v14" />
    </g>
  </g>
</svg>
