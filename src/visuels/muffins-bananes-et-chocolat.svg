<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Muffins aux bananes et pépites de chocolat</title>
  <desc id="d">Illustration à plat : un muffin dans sa caissette avec des pépites de chocolat, une banane à côté, fond ocre.</desc>
  <rect width="400" height="300" fill="#E0A93B" />
  <g fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- muffin : caissette -->
    <path d="M158 168l10 56h64l10-56z" fill="#C8674B" fill-opacity="0.9" />
    <path d="M170 184h60M174 204h52" opacity="0.5" stroke-width="3" />
    <!-- dôme du muffin -->
    <path d="M150 168c0-34 100-34 100 0z" fill="#8A4B3C" fill-opacity="0.9" />
    <path d="M150 168c0-34 100-34 100 0z" />
    <!-- pépites de chocolat -->
    <circle cx="180" cy="150" r="4" fill="#2B2B2B" stroke="none" />
    <circle cx="204" cy="140" r="4" fill="#2B2B2B" stroke="none" />
    <circle cx="222" cy="152" r="4" fill="#2B2B2B" stroke="none" />
    <circle cx="196" cy="158" r="4" fill="#2B2B2B" stroke="none" />
    <!-- banane à côté -->
    <path d="M276 150c30 6 52-6 60-30-2 34-26 54-58 46z" fill="#FBF7F0" fill-opacity="0.95" />
    <path d="M276 150c30 6 52-6 60-30-2 34-26 54-58 46z" />
    <path d="M282 166l-4 8M336 120l4-8" />
  </g>
</svg>
