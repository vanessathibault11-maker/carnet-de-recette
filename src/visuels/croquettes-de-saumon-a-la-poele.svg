<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Croquettes de saumon à la poêle</title>
  <desc id="d">Illustration à plat : une poêle avec trois croquettes dorées, une tranche de citron, fond bleu-vert.</desc>
  <rect width="400" height="300" fill="#3E7C7B" />
  <g fill="none" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vapeur -->
    <path d="M182 92c-8-10-8-18 0-27M212 88c-8-10-8-18 0-27" opacity="0.5" />
    <!-- poêle -->
    <circle cx="196" cy="162" r="62" fill="#2B2B2B" fill-opacity="0.15" />
    <circle cx="196" cy="162" r="62" />
    <path d="M258 162h72" />
    <!-- croquettes -->
    <ellipse cx="176" cy="150" rx="24" ry="17" fill="#E0A93B" fill-opacity="0.9" />
    <ellipse cx="176" cy="150" rx="24" ry="17" />
    <ellipse cx="216" cy="176" rx="24" ry="17" fill="#E0A93B" fill-opacity="0.9" />
    <ellipse cx="216" cy="176" rx="24" ry="17" />
    <ellipse cx="220" cy="140" rx="22" ry="16" fill="#E0A93B" fill-opacity="0.9" />
    <ellipse cx="220" cy="140" rx="22" ry="16" />
    <!-- flocons dorés -->
    <path d="M166 148h20M210 174h20M212 138h16" opacity="0.6" stroke="#2B2B2B" stroke-width="3" />
    <!-- tranche de citron -->
    <circle cx="118" cy="196" r="20" fill="#E0A93B" />
    <circle cx="118" cy="196" r="20" />
    <path d="M118 176v40M98 196h40M104 182l28 28M132 182l-28 28" stroke="#2B2B2B" stroke-width="2.5" opacity="0.5" />
  </g>
</svg>
