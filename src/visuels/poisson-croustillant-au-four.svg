<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Poisson croustillant au four</title>
  <desc id="d">Illustration à plat : un filet de poisson pané doré sur une assiette, avec un quartier de citron, fond crème.</desc>
  <rect width="400" height="300" fill="#3E7C7B" />
  <g fill="none" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- assiette -->
    <ellipse cx="200" cy="168" rx="118" ry="70" fill="#FBF7F0" stroke="#FBF7F0" />
    <ellipse cx="200" cy="168" rx="96" ry="54" fill="none" stroke="#3E7C7B" stroke-width="3" opacity="0.4" />
    <!-- filet de poisson pané -->
    <path d="M132 168c0-30 28-46 68-46s68 16 68 46-28 46-68 46-68-16-68-46z" fill="#E0A93B" stroke="#2B2B2B" />
    <!-- points de panure croustillante -->
    <circle cx="170" cy="156" r="3" fill="#2B2B2B" stroke="none" opacity="0.5" />
    <circle cx="196" cy="170" r="3" fill="#2B2B2B" stroke="none" opacity="0.5" />
    <circle cx="222" cy="158" r="3" fill="#2B2B2B" stroke="none" opacity="0.5" />
    <circle cx="238" cy="180" r="3" fill="#2B2B2B" stroke="none" opacity="0.5" />
    <circle cx="184" cy="188" r="3" fill="#2B2B2B" stroke="none" opacity="0.5" />
    <!-- quartier de citron -->
    <g transform="translate(300 210)">
      <path d="M0 0a30 30 0 0 1 30 30H0z" fill="#E0A93B" stroke="#2B2B2B" />
      <path d="M4 6l18 18M14 4l12 20M24 6l6 20" stroke="#2B2B2B" stroke-width="2.5" opacity="0.6" />
    </g>
    <!-- persil -->
    <circle cx="110" cy="120" r="6" fill="#2E5E3A" stroke="none" />
    <circle cx="122" cy="112" r="5" fill="#2E5E3A" stroke="none" />
    <circle cx="118" cy="126" r="5" fill="#2E5E3A" stroke="none" />
  </g>
</svg>
