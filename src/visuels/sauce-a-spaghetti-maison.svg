<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Sauce à spaghetti maison</title>
  <desc id="d">Illustration à plat : une marmite de sauce tomate qui mijote, avec une tomate et des pâtes, fond crème.</desc>
  <rect width="400" height="300" fill="#E5DFD5" />
  <g fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vapeur -->
    <path d="M176 96c-8-10-8-18 0-27M200 92c-8-10-8-18 0-27M224 96c-8-10-8-18 0-27" opacity="0.55" />
    <!-- marmite -->
    <path d="M120 150h160v22a44 44 0 0 1-44 44H164a44 44 0 0 1-44-44z" fill="#FBF7F0" />
    <path d="M110 150h180" />
    <path d="M110 138h-16a10 10 0 0 0 0 20h16M290 138h16a10 10 0 0 1 0 20h-16" />
    <!-- sauce qui bouillonne -->
    <path d="M150 168c14 8 26 8 40 0s26-8 40 0 26 8 40 0" opacity="0.5" />
    <circle cx="180" cy="185" r="4" fill="#2B2B2B" stroke="none" opacity="0.4" />
    <circle cx="220" cy="192" r="4" fill="#2B2B2B" stroke="none" opacity="0.4" />
    <!-- tomate à gauche -->
    <circle cx="86" cy="212" r="26" fill="#FBF7F0" />
    <path d="M86 186v-8M86 186l-9-6M86 186l9-6" />
    <!-- pâtes enroulées à droite -->
    <g transform="translate(300 206)">
      <path d="M-8-20c22 0 22 34 0 34s-22-24 0-24 22 24 0 24" opacity="0.75" />
    </g>
  </g>
</svg>
