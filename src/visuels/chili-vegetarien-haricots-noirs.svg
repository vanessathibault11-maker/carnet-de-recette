<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Chili végétarien aux haricots noirs</title>
  <desc id="d">Illustration à plat : un bol de chili fumant garni de haricots et de maïs, une cuillère, fond vert.</desc>
  <rect width="400" height="300" fill="#2E5E3A" />
  <g fill="none" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vapeur -->
    <path d="M176 96c-8-10-8-18 0-27M204 92c-8-10-8-18 0-27M232 96c-8-10-8-18 0-27" opacity="0.55" />
    <!-- bol -->
    <path d="M120 148h164a82 60 0 0 1-164 0z" fill="#FBF7F0" />
    <path d="M112 148h180" />
    <!-- garnitures (haricots et maïs) -->
    <ellipse cx="168" cy="168" rx="9" ry="6" fill="#2B2B2B" fill-opacity="0.4" stroke="none" />
    <ellipse cx="210" cy="176" rx="9" ry="6" fill="#2B2B2B" fill-opacity="0.4" stroke="none" />
    <ellipse cx="242" cy="164" rx="9" ry="6" fill="#2B2B2B" fill-opacity="0.4" stroke="none" />
    <circle cx="190" cy="162" r="5" fill="#FBF7F0" stroke="none" />
    <circle cx="224" cy="182" r="5" fill="#FBF7F0" stroke="none" />
    <!-- cuillère -->
    <g transform="translate(316 150) rotate(20)">
      <path d="M0 0c-12 0-12 20 0 20s12-20 0-20z" fill="#FBF7F0" />
      <path d="M0 20v46" />
    </g>
  </g>
</svg>
